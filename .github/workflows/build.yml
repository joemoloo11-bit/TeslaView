name: Build

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_LINK: ""
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TeslaView-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package macOS DMG
        run: npx electron-builder --mac dmg --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: TeslaView-macOS-DMG
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package Linux AppImage
        run: npx electron-builder --linux AppImage --publish=never

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: TeslaView-Linux-AppImage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 30
